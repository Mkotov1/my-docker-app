name: Bash and Docker CI

on:
  push:
  pull_request:

jobs:
  check-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n monitoring/monitor.sh
          bash -n deploy-monitor.sh

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-docker-app:ci .

      - name: Run Docker container
        run: docker run -d --name ci-web -p 8084:80 my-docker-app:ci

      - name: Check HTTP response
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8084/ -o /tmp/response.html
          grep -q "My first DevOps project" /tmp/response.html

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Container logs ==="
          docker logs ci-web || true

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/mkotov1/my-docker-app"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          docker tag my-docker-app:ci "$IMAGE:main"
          docker tag my-docker-app:ci "$IMAGE:sha-$SHORT_SHA"

          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$SHORT_SHA"
