name: Bash and Docker CI

on:
  push:
  pull_request:

jobs:
  check-bash:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n monitoring/monitor.sh
          bash -n deploy-monitor.sh

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-docker-app:ci .
